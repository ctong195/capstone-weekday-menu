<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weekday Menu</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="page">
      <h1>Weekday 3-Dish Menu</h1>
      <p class="subtitle">Every dish is $15.95. Pickup slots run 10:30 AM to 2:30 PM.</p>

      <section class="card" id="menu-card">
        <h2>Today's Menu</h2>
        <ul id="menu-list"></ul>
      </section>

      <section class="card">
        <h2>Create Order</h2>
        <form id="order-form">
          <label>
            Name
            <input type="text" id="customer-name" required />
          </label>

          <label>
            Contact
            <input type="text" id="customer-contact" required />
          </label>

          <label>
            Order Date
            <input type="date" id="order-date" required />
          </label>

          <label>
            Pickup Slot
            <select id="pickup-slot" required></select>
          </label>

          <fieldset>
            <legend>Select Dishes</legend>
            <div id="dish-options"></div>
          </fieldset>

          <label>
            Payment
            <select id="payment-provider" required>
              <option value="apple_pay">Apple Pay</option>
              <option value="google_pay">Google Pay</option>
              <option value="paypal">PayPal</option>
            </select>
          </label>

          <button type="submit">Place Order</button>
        </form>
      </section>

      <section class="card">
        <h2>Result</h2>
        <pre id="result"></pre>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
